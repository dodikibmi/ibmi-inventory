name: IBM i CI

# Lint runs on every push and pull request (no IBM i needed).
# Build + unit tests run on the IBM i over SSH. The target is the free public
# system PUB400, so they run on demand (Actions -> IBM i CI -> Run workflow)
# instead of on every push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  IBMI_HOST: pub400.com
  IBMI_PORT: "2222"
  IBMI_USER: DODIKIBMI
  OBJLIB: DODIKIBMI1        # programs
  DTALIB: DODIKIBMI2        # tables (created once from sql/), iRPGUnit
  REMOTE_DIR: /home/DODIKIBMI/ci/ibmi-inventory

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Source checks (ci/lint.py)
        run: python3 ci/lint.py
      - name: Shell scripts (shellcheck)
        run: shellcheck ci/*.sh api/*.sh

  build-and-test:
    needs: lint
    if: github.event_name == 'workflow_dispatch'
    # Self-hosted runner (label "ibmi") on a PC that can reach the IBM i: PUB400
    # closes SSH connections from GitHub-hosted (cloud) runners before login,
    # the same way a company IBM i sits behind its firewall. Only a manual
    # "Run workflow" (repository write access) sends a job to this runner;
    # pull requests from forks get the lint job on a GitHub-hosted runner only.
    runs-on: [self-hosted, ibmi]
    defaults:
      run:
        shell: bash
    concurrency: pub400            # one build at a time on the shared library
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: SSH key for the IBM i
        env:
          SSH_KEY: ${{ secrets.IBMI_SSH_KEY }}
        run: |
          # key and config live in this job's temp directory, not in ~/.ssh
          D="$(cd "$RUNNER_TEMP" && pwd)/ibmi-ssh"
          rm -rf "$D" && mkdir -p "$D" && chmod 700 "$D"
          printf '%s\n' "$SSH_KEY" > "$D/key" && chmod 600 "$D/key"
          # PUB400 host key, pinned (no trust-on-first-use in CI)
          echo '[pub400.com]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP9bBRME9Px9aBJ4nujQzpcz9DDAmBkkaL8N7gRWqqtT' > "$D/known_hosts"
          cat > "$D/config" <<CFG
          Host ibmi
            HostName $IBMI_HOST
            Port $IBMI_PORT
            User $IBMI_USER
            IdentityFile $D/key
            IdentitiesOnly yes
            UserKnownHostsFile $D/known_hosts
            StrictHostKeyChecking yes
            BatchMode yes
            ServerAliveInterval 30
          CFG
          echo "IBMI_SSH=ssh -F $D/config ibmi" >> "$GITHUB_ENV"
          ssh -F "$D/config" ibmi true

      - name: Copy the source to the IFS
        run: |
          git archive --format=tar HEAD -- iproj.json Rules.mk ci qddssrc qrpglesrc qclsrc |
            $IBMI_SSH "rm -rf $REMOTE_DIR && mkdir -p $REMOTE_DIR && cd $REMOTE_DIR && /QOpenSys/pkgs/bin/tar xf - &&
                      /QOpenSys/usr/bin/find . -type f -exec /QOpenSys/usr/bin/setccsid 1208 {} +"

      - name: Build with Bob (makei)
        run: $IBMI_SSH "cd $REMOTE_DIR && OBJLIB=$OBJLIB DTALIB=$DTALIB /QOpenSys/pkgs/bin/bash ci/build.sh"

      - name: Unit tests (iRPGUnit)
        run: $IBMI_SSH "cd $REMOTE_DIR && OBJLIB=$OBJLIB RULIB=$DTALIB /QOpenSys/pkgs/bin/bash ci/test.sh"

      - name: Fetch compile listings and annotate errors
        if: always()
        run: |
          $IBMI_SSH "cd $REMOTE_DIR && /QOpenSys/pkgs/bin/tar cf - .logs .evfevent 2>/dev/null" | tar xf - || true
          python ci/annotate.py "$REMOTE_DIR"
          if [ -f .logs/rpgunit.txt ]; then
            { echo '### iRPGUnit'; echo '```'; grep -E 'Success|FAILURE|Expected|test cases' .logs/rpgunit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove the key from the runner
        if: always()
        run: rm -rf "$(cd "$RUNNER_TEMP" && pwd)/ibmi-ssh"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ibmi-build-logs
          path: |
            .logs/
            .evfevent/
          include-hidden-files: true
          if-no-files-found: ignore
